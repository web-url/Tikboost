<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scar Aim Trainer</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

header {
  padding: 15px;
  background: #111;
  border-bottom: 1px solid #333;
}

h1 {
  color: #00ff88;
  font-size: 24px;
}

.stats {
  display: flex;
  justify-content: space-around;
  padding: 12px;
  background: #151515;
  font-size: 14px;
}

.stat span {
  display: block;
  color: #00ff88;
  font-size: 19px;
  font-weight: bold;
}

#game {
  position: relative;
  height: calc(100vh - 150px);
  background:
    linear-gradient(#111 1px, transparent 1px),
    linear-gradient(90deg, #111 1px, transparent 1px);
  background-size: 30px 30px;
  overflow: hidden;
  cursor: crosshair;
}

.target {
  position: absolute;
  width: 70px;
  height: 110px;
  user-select: none;
  touch-action: manipulation;
}

.head {
  width: 38px;
  height: 38px;
  background: #ff3030;
  border: 3px solid white;
  border-radius: 50%;
  margin: auto;
}

.body {
  width: 55px;
  height: 70px;
  background: #287cff;
  border: 3px solid white;
  border-radius: 20px 20px 8px 8px;
  margin: 2px auto;
}

.hit {
  animation: hit .15s;
}

@keyframes hit {
  50% {
    transform: scale(1.3);
  }
}

#message {
  position: absolute;
  top: 45%;
  width: 100%;
  font-size: 22px;
  color: #00ff88;
  pointer-events: none;
}

.controls {
  position: fixed;
  bottom: 10px;
  left: 0;
  right: 0;
}

button, select {
  background: #00ff88;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: bold;
  margin: 3px;
}

button:active {
  transform: scale(.95);
}
</style>
</head>

<body>

<header>
  <h1>⚡ SCAR AIM TRAINER</h1>
</header>

<div class="stats">
  <div class="stat">Score<span id="score">0</span></div>
  <div class="stat">Accuracy<span id="accuracy">100%</span></div>
  <div class="stat">Combo<span id="combo">0</span></div>
  <div class="stat">Reaction<span id="reaction">0ms</span></div>
</div>

<div id="game">
  <div id="message">Press START</div>
</div>

<div class="controls">
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard">Hard</option>
  </select>

  <button onclick="startGame()">START</button>
  <button onclick="resetGame()">RESET</button>
</div>

<script>
const game = document.getElementById("game");
const message = document.getElementById("message");

let score = 0;
let shots = 0;
let hits = 0;
let combo = 0;
let bestCombo = 0;
let startTime = 0;
let playing = false;
let target;

const speeds = {
  easy: 1800,
  medium: 1200,
  hard: 750
};

function startGame() {
  resetGame();

  playing = true;
  message.style.display = "none";

  spawnTarget();
}

function resetGame() {
  playing = false;

  if (target) {
    target.remove();
    target = null;
  }

  score = 0;
  shots = 0;
  hits = 0;
  combo = 0;
  bestCombo = 0;

  updateStats();

  message.innerText = "Press START";
  message.style.display = "block";
}

function spawnTarget() {

  if (!playing) return;

  if (target) target.remove();

  target = document.createElement("div");
  target.className = "target";

  target.innerHTML = `
    <div class="head"></div>
    <div class="body"></div>
  `;

  const maxX = game.clientWidth - 80;
  const maxY = game.clientHeight - 130;

  target.style.left = Math.random() * maxX + "px";
  target.style.top = Math.random() * maxY + "px";

  game.appendChild(target);

  startTime = performance.now();

  target.querySelector(".head").onclick = function(e) {
    e.stopPropagation();
    hitTarget(true);
  };

  target.querySelector(".body").onclick = function(e) {
    e.stopPropagation();
    hitTarget(false);
  };

  setTimeout(() => {
    if (target && playing) {
      combo = 0;
      spawnTarget();
      updateStats();
    }
  }, speeds[document.getElementById("difficulty").value]);
}

game.onclick = function() {
  if (!playing) return;

  shots++;
  combo = 0;

  updateStats();
};

function hitTarget(headshot) {

  if (!playing) return;

  const reaction = Math.round(performance.now() - startTime);

  shots++;
  hits++;

  combo++;

  if (combo > bestCombo) {
    bestCombo = combo;
  }

  if (headshot) {
    score += 100 + combo * 5;
  } else {
    score += 30;
  }

  document.getElementById("reaction").innerText =
    reaction + "ms";

  spawnTarget();
  updateStats();
}

function updateStats() {

  document.getElementById("score").innerText = score;

  const acc = shots === 0
    ? 100
    : Math.round((hits / shots) * 100);

  document.getElementById("accuracy").innerText =
    acc + "%";

  document.getElementById("combo").innerText =
    combo;
}
</script>

</body>
</html>
